# Debian 13 unattended install for the Umax VisionBook 9Wi Pro tablets (reproduces tab01).
# Loaded with `auto=true priority=critical file=/cdrom/tablet/preseed.cfg`; site.cfg (Wi-Fi) is generated by build.sh.
d-i preseed/include string site.cfg

# Locale, keyboard, time
d-i debian-installer/locale string en_US.UTF-8
d-i debian-installer/language string en
d-i debian-installer/country string CZ
d-i localechooser/supported-locales multiselect en_US.UTF-8
d-i keyboard-configuration/xkb-keymap select cz
d-i keyboard-configuration/layoutcode string cz
d-i console-setup/ask_detect boolean false
d-i clock-setup/utc boolean true
d-i time/zone string Europe/Prague
d-i clock-setup/ntp boolean true

# Network (the real hostname is set from the MAC in late.sh)
d-i netcfg/choose_interface select auto
d-i netcfg/get_hostname string tablet
d-i netcfg/get_domain string
d-i netcfg/hostname string tablet
d-i netcfg/wireless_wep string
d-i hw-detect/load_firmware boolean true

# Mirror
d-i mirror/country string manual
d-i mirror/http/hostname string deb.debian.org
d-i mirror/http/directory string /debian
d-i mirror/http/proxy string
d-i apt-setup/non-free-firmware boolean true
d-i apt-setup/non-free boolean false
d-i apt-setup/contrib boolean false
d-i apt-setup/services-select multiselect security, updates

# User: otos, root disabled. The password is locked again in late.sh (SSH key + console auto-login only),
# this throwaway hash only satisfies the installer.
d-i passwd/root-login boolean false
d-i passwd/user-fullname string otos
d-i passwd/username string otos
d-i passwd/user-uid string 1000
d-i passwd/user-password-crypted password !
d-i user-setup/encrypt-home boolean false

# Disk: the whole eMMC (chosen and guarded in pick-disk.sh). Own recipe = tab01's layout (ESP 1 GB, ext4 root, swap
# 1.5 GB); trixie's stock "atomic" recipe fails with "Unable to satisfy all constraints" on smaller disks.
d-i partman/early_command string sh /cdrom/tablet/pick-disk.sh
d-i partman-auto/method string regular
d-i partman-partitioning/choose_label string gpt
d-i partman-partitioning/default_label string gpt
d-i partman-auto/expert_recipe string \
    tablet :: \
        1000 1000 1000 free $iflabel{ gpt } $reusemethod{ } method{ efi } format{ } . \
        3000 10000 -1 ext4 method{ format } format{ } use_filesystem{ } filesystem{ ext4 } mountpoint{ / } . \
        1536 1536 1536 linux-swap method{ swap } format{ } .
d-i partman-auto/choose_recipe select tablet
d-i partman-lvm/device_remove_lvm boolean true
d-i partman-md/device_remove_md boolean true
d-i partman-lvm/confirm boolean true
d-i partman-lvm/confirm_nooverwrite boolean true
d-i partman-partitioning/confirm_write_new_label boolean true
d-i partman/choose_partition select finish
d-i partman/confirm boolean true
d-i partman/confirm_nooverwrite boolean true
d-i partman-efi/non_efi_system boolean true

# Packages
tasksel tasksel/first multiselect standard, ssh-server
d-i pkgsel/include string sudo curl git htop wireless-tools firmware-realtek firmware-intel-graphics firmware-intel-misc firmware-misc-nonfree intel-microcode
d-i pkgsel/upgrade select full-upgrade
popularity-contest popularity-contest/participate boolean false

# Boot loader (grub-efi-ia32 on the tablets' 32-bit UEFI); also as EFI/BOOT/BOOTIA32.EFI for picky firmware.
d-i grub-installer/only_debian boolean true
d-i grub-installer/with_other_os boolean false
d-i grub-installer/force-efi-extra-removable boolean true

# Finish: tab01's setup, then reboot without asking.
d-i preseed/late_command string sh /cdrom/tablet/late.sh
d-i finish-install/reboot_in_progress note
d-i cdrom-detect/eject boolean false
